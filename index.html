<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hamburger -->
<button id="menuBtn">☰</button>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">

        <button id="darkModeBtn">🌙 Dark Mode</button>
        <button class="new-chat">+ New Chat</button>

        <div id="history"></div>
    </div>

    <!-- Chat -->
    <div id="chat">

        <div id="messages">

            <!-- Welcome -->
            <div id="welcome">
                <h2>Welcome 👋</h2>
                <p>How can I help you today?</p>

                <div class="cards">
                    <div class="card">💡 Give ideas</div>
                    <div class="card">📚 Explain topic</div>
                    <div class="card">🧠 Solve problem</div>
                    <div class="card">✍️ Write content</div>
                </div>
            </div>

        </div>

        <!-- Input -->
        <div class="input-area">
            <input type="text" id="input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

</div>

<script src="chat.js"></script>

</body>
</html>
